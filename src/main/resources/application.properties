spring.application.name=horror-site

# Conexao com o Supabase.
# Nada de credencial neste arquivo: os tres valores vem do ambiente, para a
# senha nunca entrar no repositorio. Veja README-DB.md para como definir.
spring.datasource.url=${FEARQUIZ_DB_URL}
spring.datasource.username=${FEARQUIZ_DB_USER}
spring.datasource.password=${FEARQUIZ_DB_PASSWORD}

# Cria/atualiza as tabelas sozinho. Serve enquanto o schema esta mudando;
# quando estabilizar, migrar para Flyway e trocar para "validate".
spring.jpa.hibernate.ddl-auto=update

# Sem isso a conexao fica presa ate o fim da renderizacao da resposta.
spring.jpa.open-in-view=false
