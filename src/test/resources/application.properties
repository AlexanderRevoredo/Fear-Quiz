# Config so dos testes: banco em memoria, para a suite rodar sem depender do
# Supabase e sem exigir nenhuma variavel de ambiente com senha.
spring.datasource.url=jdbc:h2:mem:fearquiz;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
